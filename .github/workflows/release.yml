name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

  release:
    needs: [verify-version]
    if: always() && needs.verify-version.result != 'failure'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ytlist ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: ${{ github.ref_type != 'tag' && inputs.draft || false }}
          prerelease: ${{ github.ref_type != 'tag' && inputs.prerelease || false }}

  arch-package:
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            github-cli \
            nodejs \
            npm \
            rust \
            pkgconf \
            webkit2gtk-4.1 \
            gtk3 \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-bad

      - uses: actions/checkout@v4

      - name: Create the build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build the package
        working-directory: packaging/arch
        run: sudo -u builder makepkg --noconfirm --nodeps

      - name: Inspect the linked libraries
        run: ldd src-tauri/target/release/ytlist

      - name: Upload the package to the release
        working-directory: packaging/arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('../../package.json').version")"
          fi
          gh release upload "$tag" ./*.pkg.tar.zst --clobber
