[package]
name = "ytlist"
version = "0.1.0"
description = "A desktop client for browsing and playing your YouTube playlists"
authors = ["H1nqts"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1.0.102"
serde_rusqlite = "0.43.0"
rusty_ytdl = { git = "https://github.com/H1nqts/rusty_ytdl", rev = "d8e5257" }
idna_adapter = "=1.2.1"
chrono = "0.4.45"
url = "2.5.8"
youtube_dl = { version = "0.10.0", features = ["downloader-rustls-tls"] }
